<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="facetGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Tile with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="256" cy="240" r="160" fill="url(#auraGlow)" opacity="0.25" filter="url(#glow)" />

  <!-- Neural Constellation Connection Nodes & Paths -->
  <path d="M120 380 L256 100 L392 380" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="120" cy="380" r="8" fill="#38bdf8" opacity="0.6" />
  <circle cx="392" cy="380" r="8" fill="#c084fc" opacity="0.6" />
  <circle cx="256" cy="100" r="10" fill="#ffffff" filter="url(#glow)" />

  <!-- Dynamic Geometric 'A' Apex (Left Wing) -->
  <path d="M256 100 L140 370 L215 370 L256 260 Z" fill="url(#facetGrad1)" />

  <!-- Dynamic Geometric 'A' Apex (Right Wing) -->
  <path d="M256 100 L372 370 L297 370 L256 260 Z" fill="url(#facetGrad2)" />

  <!-- Ascending Path Bridge / Crossbar -->
  <path d="M185 300 L327 300 L297 340 L215 340 Z" fill="url(#crossGrad)" filter="url(#glow)" />

  <!-- Glowing Core Intelligence Spark -->
  <polygon points="256,160 268,195 305,200 275,225 285,260 256,238 227,260 237,225 207,200 244,195" fill="#ffffff" opacity="0.95" filter="url(#glow)" />
  <circle cx="256" cy="210" r="6" fill="#67e8f9" />
</svg>
